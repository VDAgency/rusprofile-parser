<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Оплата — Парсер компаний</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f4fa);
            --text: var(--tg-theme-text-color, #000000);
            --hint: var(--tg-theme-hint-color, #999999);
            --btn: var(--tg-theme-button-color, #3390ec);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --link: var(--tg-theme-link-color, #3390ec);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .card {
            background: var(--secondary-bg);
            border-radius: 12px;
            padding: 28px 22px;
            text-align: center;
        }
        .icon {
            font-size: 56px;
            line-height: 1;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 19px;
            font-weight: 600;
            margin: 0 0 12px;
        }
        p {
            font-size: 14px;
            line-height: 1.5;
            color: var(--hint);
            margin: 0 0 12px;
        }
        .tariff-line {
            display: inline-block;
            padding: 6px 12px;
            background: var(--bg);
            border-radius: 14px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            margin: 8px 0 16px;
        }
        .actions {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            font-size: 15px;
            font-weight: 500;
            padding: 12px 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-primary {
            background: var(--btn);
            color: var(--btn-text);
        }
        .btn-secondary {
            background: transparent;
            color: var(--link);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⚙️</div>
        <h1>Сервис платежей ещё в разработке</h1>
        <div id="tariffLine" class="tariff-line"></div>
        <p>
            Мы готовим эквайринг для приёма оплаты картой. Пока — пожалуйста,
            напишите в поддержку, мы активируем тариф вручную и пришлём
            реквизиты для оплаты.
        </p>
        <p>
            После подключения автоплатежей этот экран обновится — оплата будет
            проходить за пару кликов.
        </p>
        <div class="actions">
            <button class="btn-primary" id="contactBtn">Связаться с поддержкой</button>
            <button class="btn-secondary" id="closeBtn">Назад в бот</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg && typeof tg.ready === 'function') {
            tg.ready();
            try { tg.expand(); } catch (_) {}
            document.body.style.backgroundColor =
                tg.themeParams?.bg_color || '#ffffff';
        }

        // Считываем выбранный тариф из ?tariff=...
        const params = new URLSearchParams(window.location.search);
        const tariff = (params.get('tariff') || '').toLowerCase();
        const tariffLineEl = document.getElementById('tariffLine');
        const tariffNames = { basic: 'Basic', pro: 'Pro' };
        if (tariffNames[tariff]) {
            tariffLineEl.textContent = 'Выбранный тариф: ' + tariffNames[tariff];
        } else {
            tariffLineEl.style.display = 'none';
        }

        document.getElementById('contactBtn').addEventListener('click', () => {
            // Открываем чат с поддержкой (TODO: настроить username).
            const supportUrl = 'https://t.me/parserclients_bot';
            if (tg && typeof tg.openTelegramLink === 'function') {
                tg.openTelegramLink(supportUrl);
            } else {
                window.open(supportUrl, '_blank');
            }
        });

        document.getElementById('closeBtn').addEventListener('click', () => {
            if (tg && typeof tg.close === 'function') {
                tg.close();
            } else {
                window.history.back();
            }
        });
    </script>
</body>
</html>
